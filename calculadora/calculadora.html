<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora de Compra</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
        }
        .header {
            background-color: #2c3e50;
            color: white;
            padding: 30px 20px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 28px;
        }
        .header a {
            color: #ecf0f1;
            font-size: 14px;
            text-decoration: underline;
        }
        .container {
            max-width: 700px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            gap: 30px;
            align-items: center;
        }
        .imagen-box {
            flex: 1;
            text-align: center;
        }
        .imagen-box img {
            max-width: 100%;
            height: auto;
        }
        .form-box {
            flex: 1;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        input {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 15px;
            width: 100%;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #2980b9;
        }
        #resultado {
            margin-top: 15px;
            font-weight: bold;
            color: #27ae60;
        }
        #error {
            margin-top: 15px;
            color: #c0392b;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Calculadora de Compra</h1>
        <a href="index.html">Volver al inicio</a>
    </div>

    <div class="container">
        <!-- Columna de la imagen -->
        <div class="imagen-box">
           <img src="temu.png" alt="Carrito de compras">
        </div>

        <!-- Columna del formulario -->
        <div class="form-box">
            <label for="precio">Precio unitario ($):</label>
            <input type="number" id="precio" step="0.01" placeholder="Ej. 12.50">

            <label for="cantidad">Cantidad de unidades:</label>
            <input type="number" id="cantidad" placeholder="Ej. 3">

            <button onclick="calcular()">Calcular total</button>

            <div id="resultado"></div>
            <div id="error"></div>
        </div>
    </div>

    <script>
        function calcular() {
            let precioStr = document.getElementById('precio').value;
            let cantidadStr = document.getElementById('cantidad').value;
            
            let resDiv = document.getElementById('resultado');
            let errDiv = document.getElementById('error');

            resDiv.innerHTML = "";
            errDiv.innerHTML = "";

            // Validación de campos vacíos
            if (precioStr.trim() === "" || cantidadStr.trim() === "") {
                errDiv.innerHTML = "Por favor complete todos los campos.";
                return;
            }

            let precio = parseFloat(precioStr);
            let cantidad = Number(cantidadStr);

            // Validación de precio mayor a 0
            if (isNaN(precio) || precio <= 0) {
                errDiv.innerHTML = "El precio debe ser un número mayor a cero.";
                return;
            }

            // Validación de cantidad entera positiva
            if (!Number.isInteger(cantidad) || cantidad <= 0) {
                errDiv.innerHTML = "La cantidad debe ser un número entero positivo.";
                return;
            }

            // Cálculo final
            let total = precio * cantidad;
            resDiv.innerHTML = "Total a pagar: $" + total.toFixed(2);
        }
    </script>

</body>
</html>
